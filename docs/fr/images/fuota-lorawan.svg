<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 532" width="920" height="532" role="img" aria-labelledby="t">
  <title id="t">Le réseau transporte, le bootloader décide</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="918" height="530" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="24" y="38" font-size="18" font-weight="700" fill="#0f172a">Le réseau transporte, le bootloader décide</text>
  <rect x="240" y="58" width="660" height="164" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="258" y="80" font-size="13" font-weight="700" fill="#b45309">Transport : non digne de confiance</text>
  <text x="882" y="80" text-anchor="end" font-size="12" fill="#b45309">clé de groupe partagée par tout le parc</text>
  <rect x="20" y="100" width="200" height="100" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2.2"/>
  <text x="120.0" y="135.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0e7490">Fabricant</text>
  <text x="120.0" y="158.0" text-anchor="middle" font-size="12.5" fill="#475569">Signe l&#x27;image</text>
  <text x="120.0" y="177.0" text-anchor="middle" font-size="12.5" fill="#475569">clé privée hors du dépôt</text>
  <rect x="255" y="100" width="190" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="350.0" y="135.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Serveur FUOTA</text>
  <text x="350.0" y="158.0" text-anchor="middle" font-size="12.5" fill="#475569">Découpe en fragments</text>
  <text x="350.0" y="177.0" text-anchor="middle" font-size="12.5" fill="#475569">+ redondance (TS004)</text>
  <rect x="475" y="100" width="190" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="570" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Réseau LoRaWAN</text>
  <text x="570" y="146" text-anchor="middle" font-size="12.5" fill="#475569">Multicast, classe C</text>
  <rect x="695" y="100" width="190" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="790.0" y="135.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Appareil</text>
  <text x="790.0" y="158.0" text-anchor="middle" font-size="12.5" fill="#475569">Reconstruit l&#x27;image</text>
  <text x="790.0" y="177.0" text-anchor="middle" font-size="12.5" fill="#475569">dans le slot secondaire</text>
  <rect x="512" y="158" width="11" height="11" rx="2" fill="#cffafe" stroke="#0e7490" stroke-width="1"/>
  <rect x="527" y="158" width="11" height="11" rx="2" fill="#cffafe" stroke="#0e7490" stroke-width="1"/>
  <rect x="542" y="158" width="11" height="11" rx="2" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
  <path d="M544.5 160.5 l6 6 M550.5 160.5 l-6 6" stroke="#b91c1c" stroke-width="1.4"/>
  <rect x="557" y="158" width="11" height="11" rx="2" fill="#cffafe" stroke="#0e7490" stroke-width="1"/>
  <rect x="572" y="158" width="11" height="11" rx="2" fill="#cffafe" stroke="#0e7490" stroke-width="1"/>
  <rect x="587" y="158" width="11" height="11" rx="2" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
  <path d="M589.5 160.5 l6 6 M595.5 160.5 l-6 6" stroke="#b91c1c" stroke-width="1.4"/>
  <rect x="602" y="158" width="11" height="11" rx="2" fill="#cffafe" stroke="#0e7490" stroke-width="1"/>
  <rect x="617" y="158" width="11" height="11" rx="2" fill="#cffafe" stroke="#0e7490" stroke-width="1"/>
  <text x="570" y="188" text-anchor="middle" font-size="11" fill="#475569">perdus, reconstruits</text>
  <line x1="220" y1="150" x2="251" y2="150" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="445" y1="150" x2="471" y2="150" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="665" y1="150" x2="691" y2="150" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="790" y1="200" x2="790" y2="266" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="800" y="248" text-anchor="start" font-size="12" font-style="italic" fill="#475569">redémarrage</text>
  <rect x="695" y="270" width="190" height="104" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2.2"/>
  <text x="790.0" y="307.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0e7490">MCUboot</text>
  <text x="790.0" y="330.0" text-anchor="middle" font-size="12.5" fill="#475569">Signature valide ?</text>
  <text x="790.0" y="349.0" text-anchor="middle" font-size="12.5" fill="#475569">Version plus récente ?</text>
  <line x1="790" y1="374" x2="790" y2="432" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="800" y="408" text-anchor="start" font-size="12" font-style="italic" fill="#475569">non</text>
  <rect x="695" y="436" width="190" height="74" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="790.0" y="468.0" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">Image refusée</text>
  <text x="790.0" y="491.0" text-anchor="middle" font-size="12.5" fill="#475569">l&#x27;ancienne démarre</text>
  <line x1="695" y1="322" x2="669" y2="322" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="682" y="312" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">oui</text>
  <rect x="475" y="287" width="190" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="570.0" y="317.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Démarrage à l&#x27;essai</text>
  <text x="570.0" y="340.0" text-anchor="middle" font-size="12.5" fill="#475569">nouvelle image, une fois</text>
  <line x1="475" y1="322" x2="449" y2="322" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="255" y="287" width="190" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="350.0" y="317.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Bon fonctionnement ?</text>
  <text x="350.0" y="340.0" text-anchor="middle" font-size="12.5" fill="#475569">join réussi, radio OK</text>
  <line x1="255" y1="322" x2="224" y2="322" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="240" y="312" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">oui</text>
  <rect x="20" y="287" width="200" height="70" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8"/>
  <text x="120.0" y="317.0" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">Image confirmée</text>
  <text x="120.0" y="340.0" text-anchor="middle" font-size="12.5" fill="#475569">elle reste en place</text>
  <line x1="350" y1="357" x2="350" y2="432" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="360" y="400" text-anchor="start" font-size="12" font-style="italic" fill="#475569">non, ou blocage</text>
  <rect x="255" y="436" width="190" height="74" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
  <text x="350.0" y="468.0" text-anchor="middle" font-size="15" font-weight="700" fill="#c2410c">Retour arrière</text>
  <text x="350.0" y="491.0" text-anchor="middle" font-size="12.5" fill="#475569">MCUboot remet l&#x27;ancienne</text>
  <rect x="22" y="440" width="16" height="16" rx="4" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
  <text x="46" y="452" font-size="12" font-weight="700" fill="#0f172a">Racine de confiance :</text>
  <text x="46" y="468" font-size="12" fill="#475569">signature et bootloader</text>
  <rect x="22" y="482" width="16" height="16" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.6" stroke-dasharray="3 2"/>
  <text x="46" y="494" font-size="12" font-weight="700" fill="#0f172a">Transport non fiable :</text>
  <text x="46" y="510" font-size="12" fill="#475569">il achemine, il ne prouve rien</text>
  </g>
</svg>
