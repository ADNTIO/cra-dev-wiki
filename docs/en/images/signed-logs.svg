  <text x="125" y="143" text-anchor="middle" font-size="12.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">prev = 000…</text>
  <rect x="44" y="158" width="162" height="24" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="1.4"/>
  <text x="125" y="175" text-anchor="middle" font-size="12.5" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0e7490">sig 0</text>
  <rect x="250" y="66" width="190" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="345" y="92" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Entry 1</text>
  <text x="345" y="114" text-anchor="middle" font-size="12.5" fill="#475569">setpoint changed</text>
  <rect x="264" y="126" width="162" height="24" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="345" y="143" text-anchor="middle" font-size="12.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">prev = sig 0</text>
  <rect x="264" y="158" width="162" height="24" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="1.4"/>
  <text x="345" y="175" text-anchor="middle" font-size="12.5" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0e7490">sig 1</text>
  <rect x="470" y="66" width="190" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="565" y="92" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Entry 2</text>
  <text x="565" y="114" text-anchor="middle" font-size="12.5" fill="#475569">firmware update</text>
  <rect x="484" y="126" width="162" height="24" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="565" y="143" text-anchor="middle" font-size="12.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">prev = sig 1</text>
  <rect x="484" y="158" width="162" height="24" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="1.4"/>
  <text x="565" y="175" text-anchor="middle" font-size="12.5" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0e7490">sig 2</text>
  <rect x="690" y="66" width="190" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="785" y="92" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Entry 3</text>
  <text x="785" y="114" text-anchor="middle" font-size="12.5" fill="#475569">access denied</text>
  <rect x="704" y="126" width="162" height="24" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="785" y="143" text-anchor="middle" font-size="12.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">prev = sig 2</text>
  <rect x="704" y="158" width="162" height="24" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="1.4"/>
  <text x="785" y="175" text-anchor="middle" font-size="12.5" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0e7490">sig 3</text>
  <path d="M206 170 C 228 170, 242 138, 262 138" fill="none" stroke="#0e7490" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <path d="M426 170 C 448 170, 462 138, 482 138" fill="none" stroke="#0e7490" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <path d="M646 170 C 668 170, 682 138, 702 138" fill="none" stroke="#0e7490" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <rect x="30" y="232" width="190" height="96" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="125.0" y="266.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b91c1c">Edit an entry</text>
  <text x="125.0" y="287.0" text-anchor="middle" font-size="12.5" fill="#475569">its signature</text>
  <text x="125.0" y="306.0" text-anchor="middle" font-size="12.5" fill="#475569">no longer matches</text>
  <rect x="250" y="232" width="190" height="96" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="345.0" y="266.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b91c1c">Delete an entry</text>
  <text x="345.0" y="287.0" text-anchor="middle" font-size="12.5" fill="#475569">the sequence and the</text>
  <text x="345.0" y="306.0" text-anchor="middle" font-size="12.5" fill="#475569">prev link break</text>
  <rect x="470" y="232" width="190" height="96" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
  <text x="565.0" y="266.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#c2410c">Cut the end</text>
  <text x="565.0" y="287.0" text-anchor="middle" font-size="12.5" fill="#475569">the chain stays valid,</text>
  <text x="565.0" y="306.0" text-anchor="middle" font-size="12.5" fill="#475569">only the anchor shows it</text>
  <rect x="690" y="232" width="190" height="96" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2.2"/>
  <text x="785.0" y="266.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0e7490">Anchor published</text>
  <text x="785.0" y="287.0" text-anchor="middle" font-size="12.5" fill="#475569">outside the device</text>
  <text x="785.0" y="306.0" text-anchor="middle" font-size="12.5" fill="#475569">4 entries, sig 3</text>
  <line x1="690" y1="280" x2="664" y2="280" stroke="#0e7490" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-cyan)"/>
  <text x="460" y="372" text-anchor="middle" font-size="12.5" fill="#475569">Ed25519: only the device&#x27;s private key signs; the auditor verifies with the public key. It attributes the entry to that key.</text>
  </g>
