<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-labelledby="t">
  <title id="t">Each entry signs the previous one</title>
  <defs><marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e7490"/></marker></defs>
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="918" height="398" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="24" y="38" font-size="18" font-weight="700" fill="#0f172a">Each entry signs the previous one</text>
  <rect x="30" y="66" width="190" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="125" y="92" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Entry 0</text>
  <text x="125" y="114" text-anchor="middle" font-size="12.5" fill="#475569">login</text>
