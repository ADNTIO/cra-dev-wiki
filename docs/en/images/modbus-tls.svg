<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 568" width="920" height="568" role="img" aria-labelledby="t">
  <title id="t">Who may write to the PLC?</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker></defs>
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="918" height="566" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="24" y="38" font-size="18" font-weight="700" fill="#0f172a">Who may write to the PLC?</text>
  <rect x="16" y="56" width="888" height="118" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="32" y="78" font-size="13" font-weight="700" fill="#b91c1c">Modbus/TCP, port 502</text>
  <rect x="40" y="92" width="210" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="145.0" y="119.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Any client</text>
  <text x="145.0" y="140.5" text-anchor="middle" font-size="12.5" fill="#475569">on the network</text>
  <rect x="355" y="92" width="210" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="460.0" y="119.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">PLC</text>
  <text x="460.0" y="140.5" text-anchor="middle" font-size="12.5" fill="#475569">no authentication</text>
  <rect x="670" y="92" width="210" height="64" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="775.0" y="119.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b91c1c">Write accepted</text>
  <text x="775.0" y="140.5" text-anchor="middle" font-size="12.5" fill="#475569">without knowing who wrote</text>
  <line x1="250" y1="124" x2="351" y2="124" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="565" y1="124" x2="666" y2="124" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="16" y="194" width="888" height="356" rx="14" fill="#f8fafc" stroke="#0e7490" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="32" y="216" font-size="13" font-weight="700" fill="#0e7490">Modbus/TCP Security, port 802</text>
  <rect x="40" y="232" width="210" height="64" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="145.0" y="269.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b91c1c">Host without a certificate</text>
  <rect x="40" y="310" width="210" height="64" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="145.0" y="337.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b91c1c">&quot;Engineer&quot; certificate</text>
  <text x="145.0" y="358.5" text-anchor="middle" font-size="12.5" fill="#475569">from another authority</text>
  <rect x="40" y="388" width="210" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="145.0" y="415.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">HMI</text>
  <text x="145.0" y="436.5" text-anchor="middle" font-size="12.5" fill="#475569">Operator role</text>
  <rect x="40" y="466" width="210" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="145.0" y="493.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Maintenance laptop</text>
  <text x="145.0" y="514.5" text-anchor="middle" font-size="12.5" fill="#475569">Engineer role</text>
  <rect x="310" y="232" width="170" height="298" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2.2"/>
  <text x="395" y="420" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0e7490">Mutual TLS</text>
  <text x="395" y="441" text-anchor="middle" font-size="12.5" fill="#475569">certificate signed by</text>
  <text x="395" y="460" text-anchor="middle" font-size="12.5" fill="#475569">the plant&#x27;s</text>
  <text x="395" y="479" text-anchor="middle" font-size="12.5" fill="#475569">authority?</text>
  <line x1="250" y1="264" x2="306" y2="264" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <path d="M323 257 l14 14 M337 257 l-14 14" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
  <text x="344" y="268" font-size="11.5" font-style="italic" fill="#b91c1c">session closed</text>
  <line x1="250" y1="342" x2="306" y2="342" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <path d="M323 335 l14 14 M337 335 l-14 14" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
  <text x="344" y="346" font-size="11.5" font-style="italic" fill="#b91c1c">session closed</text>
  <line x1="250" y1="420" x2="306" y2="420" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="480" y1="420" x2="536" y2="420" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="250" y1="498" x2="306" y2="498" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="480" y1="498" x2="536" y2="498" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="540" y="388" width="150" height="142" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2.2"/>
  <text x="615.0" y="445.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0e7490">Authorisation</text>
  <text x="615.0" y="466.0" text-anchor="middle" font-size="12.5" fill="#475569">by role</text>
  <text x="615.0" y="485.0" text-anchor="middle" font-size="12.5" fill="#475569">rules.toml</text>
  <line x1="690" y1="420" x2="716" y2="420" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="690" y1="498" x2="716" y2="498" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="720" y="380" width="180" height="80" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
  <text x="810.0" y="406.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#c2410c">Read: yes</text>
  <text x="810.0" y="427.0" text-anchor="middle" font-size="12.5" fill="#475569">Write: exception 01,</text>
  <text x="810.0" y="446.0" text-anchor="middle" font-size="12.5" fill="#475569">refusal logged</text>
  <rect x="720" y="466" width="180" height="64" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8"/>
  <text x="810.0" y="493.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#15803d">Read: yes</text>
  <text x="810.0" y="514.5" text-anchor="middle" font-size="12.5" fill="#475569">Write: yes</text>
  </g>
</svg>
