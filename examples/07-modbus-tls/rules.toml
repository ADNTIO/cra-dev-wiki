# Roles-to-rights rules of the demo PLC.
#
# A role comes from the client certificate (extension 1.3.6.1.4.1.50316.802.1).
# Function codes: 1-4 read, 5-6 and 15-16 write. A role absent from this file, or
# a certificate without a role, gets no right at all.

[roles.Operator]
functions = [1, 2, 3, 4]

[roles.Engineer]
functions = [1, 2, 3, 4, 5, 6, 15, 16]
