# Réglages du bootloader. Sur ESP32, les valeurs par défaut de MCUboot sont :
# pas de signature, pas de vérification du slot primaire, écrasement sans retour
# arrière, console coupée. On les remplace toutes.

# Vérifier aussi l'image en place à chaque démarrage
CONFIG_BOOT_VALIDATE_SLOT0=y

# Refuser une image plus ancienne que celle en place
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y

# Le bootloader dit ce qu'il décide
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
CONFIG_BOOT_BANNER=y
