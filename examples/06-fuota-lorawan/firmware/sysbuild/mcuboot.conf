# Bootloader settings. On ESP32, MCUboot's defaults are: no signature, no check of
# the primary slot, overwrite without rollback, console off. We replace them all.

# Also check the image in place at every boot
CONFIG_BOOT_VALIDATE_SLOT0=y

# Reject an image older than the one in place
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y

# The bootloader reports what it decides
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
CONFIG_BOOT_BANNER=y
