# Update over point-to-point LoRa (two-board bench, without a LoRaWAN network).
# Add with -Dfirmware_EXTRA_CONF_FILE=p2p.conf
CONFIG_APP_TRANSPORT_P2P=y

# 200-byte fragments: 4 times fewer frames than with 48, for the same RAM
CONFIG_LORAWAN_FRAG_TRANSPORT_MIN_FRAG_SIZE=200
CONFIG_LORAWAN_FRAG_TRANSPORT_MAX_FRAG_SIZE=200
