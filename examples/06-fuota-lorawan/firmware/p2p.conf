# Mise à jour par LoRa point à point (banc à deux cartes, sans réseau LoRaWAN).
# À ajouter avec -Dfirmware_EXTRA_CONF_FILE=p2p.conf
CONFIG_APP_TRANSPORT_P2P=y

# Fragments de 200 octets : 4 fois moins de trames qu'avec 48, pour la même RAM
CONFIG_LORAWAN_FRAG_TRANSPORT_MIN_FRAG_SIZE=200
CONFIG_LORAWAN_FRAG_TRANSPORT_MAX_FRAG_SIZE=200
