CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_REBOOT=y
CONFIG_WATCHDOG=y

# Radio et pile LoRaWAN
CONFIG_LORA=y
CONFIG_LORAWAN=y
CONFIG_LORAWAN_REGION_EU868=y

# Le DevNonce doit survivre aux redémarrages
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_LORAWAN_NVM_SETTINGS=y
CONFIG_ENTROPY_GENERATOR=y

# Les trois briques FUOTA
CONFIG_LORAWAN_SERVICES=y
CONFIG_LORAWAN_APP_CLOCK_SYNC=y
CONFIG_LORAWAN_REMOTE_MULTICAST=y
CONFIG_LORAWAN_FRAG_TRANSPORT=y

# Écriture de l'image reçue dans le slot secondaire
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y

# Dimensionnement du décodeur de fragments. Sa mémoire dépend du nombre de
# fragments (taille d'image / taille de fragment) et de la redondance tolérée :
# avec les valeurs par défaut (toute la partition, fragments de 48 octets, 20 %),
# il réclame plus de 5 Mo de RAM. On fixe donc ce que le serveur enverra.
CONFIG_LORAWAN_FRAG_TRANSPORT_DECODER_LOWMEM=y
CONFIG_LORAWAN_FRAG_TRANSPORT_IMAGE_SIZE=393216
CONFIG_LORAWAN_FRAG_TRANSPORT_MIN_FRAG_SIZE=48
CONFIG_LORAWAN_FRAG_TRANSPORT_MAX_FRAG_SIZE=48
CONFIG_LORAWAN_FRAG_TRANSPORT_MAX_REDUNDANCY=10

# Écran : logo et étapes (sans effet sur une carte sans écran)
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
