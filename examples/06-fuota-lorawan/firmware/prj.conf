CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_REBOOT=y
CONFIG_WATCHDOG=y

# Radio and LoRaWAN stack
CONFIG_LORA=y
CONFIG_LORAWAN=y
CONFIG_LORAWAN_REGION_EU868=y

# The DevNonce must survive reboots
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_LORAWAN_NVM_SETTINGS=y
CONFIG_ENTROPY_GENERATOR=y

# The three FUOTA building blocks
CONFIG_LORAWAN_SERVICES=y
CONFIG_LORAWAN_APP_CLOCK_SYNC=y
CONFIG_LORAWAN_REMOTE_MULTICAST=y
CONFIG_LORAWAN_FRAG_TRANSPORT=y

# Writing the received image to the secondary slot
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y

# Sizing of the fragment decoder. Its memory depends on the number of fragments
# (image size / fragment size) and on the tolerated redundancy: with the defaults
# (whole partition, 48-byte fragments, 20%), it asks for more than 5 MB of RAM.
# So we fix what the server will send.
CONFIG_LORAWAN_FRAG_TRANSPORT_DECODER_LOWMEM=y
CONFIG_LORAWAN_FRAG_TRANSPORT_IMAGE_SIZE=393216
CONFIG_LORAWAN_FRAG_TRANSPORT_MIN_FRAG_SIZE=48
CONFIG_LORAWAN_FRAG_TRANSPORT_MAX_FRAG_SIZE=48
CONFIG_LORAWAN_FRAG_TRANSPORT_MAX_REDUNDANCY=10

# Screen: logo and steps (no effect on a board without a screen)
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
