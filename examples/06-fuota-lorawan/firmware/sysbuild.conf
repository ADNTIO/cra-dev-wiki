SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Signature obligatoire. La clé, elle, se passe à la compilation :
#   -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE='"/chemin/hors-depot/cle.pem"'
# Sans cette option, le build prend la clé d'exemple publique de MCUboot.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# Échange des deux slots, pour pouvoir revenir à l'image précédente
SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH=y
