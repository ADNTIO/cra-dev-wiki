SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Signature required. The key itself is passed at build time:
#   -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE='"/path/outside-the-repo/key.pem"'
# Without this option, the build uses MCUboot's public example key.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# Swap the two slots, so the previous image can be restored
SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH=y
