# La console série sert au protocole avec le PC : pas de journaux mêlés
CONFIG_LOG=n
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETLINE=y
# Lignes « DATA »/« TX » de 100 octets en hexadécimal (128 caractères par défaut)
CONFIG_CONSOLE_INPUT_MAX_LINE_LEN=255
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_LORA=y

CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y

# Les cartes Heltec V2 ont souvent un ESP32 en révision 1, que le démarrage
# simple (sans MCUboot) refuse par défaut
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y
