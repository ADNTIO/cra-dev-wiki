# The serial console carries the protocol with the PC: no logs mixed in
CONFIG_LOG=n
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETLINE=y
# "DATA"/"TX" lines of 100 bytes in hex (128 characters by default)
CONFIG_CONSOLE_INPUT_MAX_LINE_LEN=255
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_LORA=y

CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y

# Heltec V2 boards often have a revision 1 ESP32, which the simple boot (without
# MCUboot) refuses by default
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y
