[project]
name = "secure-logging-example"
version = "0.1.0"
description = "CRA & Dev #7: a chained, signed security log, and why signatures give non-repudiation"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
